apiVersion: batch/v1
kind: Job
metadata:
  name: k6-loadtest
  namespace: apps
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.55.0
          args: ["run", "/scripts/load.js"]
          env:
            - name: BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: k6-env
                  key: BASE_URL
            - name: JWT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: k6-env
                  key: JWT_TOKEN
          volumeMounts:
            - name: script
              mountPath: /scripts
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "512Mi" }
      volumes:
        - name: script
          configMap:
            name: k6-script
