name: Infra

on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra.yml"
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: ap-southeast-1
  TF_VERSION: 1.9.8
  TF_DIR: infra/terraform/envs/stage

jobs:
  fmt-validate:
    name: fmt + validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: fmt
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - name: validate (stage)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -backend=false
          terraform validate

  plan:
    name: plan
    needs: fmt-validate
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/twitter-mc-github-actions
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Resolve backend from bootstrap outputs
        id: backend
        working-directory: infra/terraform/bootstrap
        run: |
          terraform init
          echo "bucket=$(terraform output -raw state_bucket)" >> "$GITHUB_OUTPUT"
      - name: init + plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="region=${{ env.AWS_REGION }}"
          terraform plan -no-color -input=false | tee plan.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/plan.txt

  apply:
    name: apply
    needs: fmt-validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-24.04
    environment: stage
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/twitter-mc-github-actions
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Resolve backend
        id: backend
        working-directory: infra/terraform/bootstrap
        run: |
          terraform init
          echo "bucket=$(terraform output -raw state_bucket)" >> "$GITHUB_OUTPUT"
      # Same two-phase pattern as `make stage-up-auto`: the alekc/kubectl
      # provider needs the EKS endpoint at config time, which doesn't exist
      # on cold start. -target the cluster first, then full apply.
      - name: apply (cluster + addons)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="region=${{ env.AWS_REGION }}"
          terraform apply -auto-approve \
            -target=module.vpc \
            -target=module.eks_cluster \
            -target=module.eks_addons
      - name: apply (rest)
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve

  destroy:
    name: destroy
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-24.04
    environment: stage
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/twitter-mc-github-actions
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Resolve backend
        id: backend
        working-directory: infra/terraform/bootstrap
        run: |
          terraform init
          echo "bucket=$(terraform output -raw state_bucket)" >> "$GITHUB_OUTPUT"
      - name: Pre-cleanup ALB Ingress
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name twitter-mc-stage || true
          kubectl -n apps delete ingress stage --wait=true || true
          sleep 60
      - name: destroy
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="region=${{ env.AWS_REGION }}"
          terraform destroy -auto-approve
