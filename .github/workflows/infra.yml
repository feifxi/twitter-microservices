name: Infra

# Manual-only. The stage env isn't always live (we tear it down between
# sessions), so auto-running plan/apply on every push would just produce
# noise or fail. Trigger from the Actions tab when you actually want to
# touch infra.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  TF_VERSION: 1.9.8
  TF_DIR: infra/terraform/envs/stage
  # Bootstrap creates this bucket as `${project}-tfstate-${account_id}`.
  TF_STATE_BUCKET: twitter-mc-tfstate-${{ vars.AWS_ACCOUNT_ID }}

jobs:
  fmt-validate:
    name: fmt + validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: fmt
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - name: validate (stage)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -backend=false
          terraform validate

  plan:
    name: plan
    needs: fmt-validate
    if: inputs.action == 'plan'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/twitter-mc-github-actions
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: init + plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"
          terraform plan -no-color -input=false | tee plan.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/plan.txt

  apply:
    name: apply
    needs: fmt-validate
    if: inputs.action == 'apply'
    runs-on: ubuntu-24.04
    environment: stage
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/twitter-mc-github-actions
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      # Two-phase apply mirrors `make stage-up-auto`. The alekc/kubectl
      # provider needs the EKS endpoint at config time; on cold start the
      # cluster doesn't exist, so `-target` the cluster first.
      - name: apply (cluster + addons)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"
          terraform apply -auto-approve \
            -target=module.vpc \
            -target=module.eks_cluster \
            -target=module.eks_addons
      - name: apply (rest)
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve

  destroy:
    name: destroy
    if: inputs.action == 'destroy'
    runs-on: ubuntu-24.04
    environment: stage
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/twitter-mc-github-actions
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      # Delete the Ingress first so the ALB controller releases the ALB
      # before the cluster is destroyed. Skipping this leaves an orphan ALB
      # whose ENIs block VPC delete (see docs/DEPLOY.md teardown gotchas).
      - name: Pre-cleanup ALB Ingress
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name twitter-mc-stage || true
          kubectl -n apps delete ingress stage --wait=true || true
          sleep 60
      - name: destroy
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"
          terraform destroy -auto-approve
