global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: tweet-service
    static_configs:
      - targets: ["tweet-service:8080"]

  - job_name: user-service
    static_configs:
      - targets: ["user-service:8080"]

  - job_name: feed-service
    static_configs:
      - targets: ["feed-service:8080"]

  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:8080"]

  - job_name: search-service
    static_configs:
      - targets: ["search-service:8080"]

  - job_name: media-service
    static_configs:
      - targets: ["media-service:8080"]
