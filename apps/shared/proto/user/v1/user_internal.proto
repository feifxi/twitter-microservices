syntax = "proto3";

package user.v1;

option go_package = "github.com/twitter/shared/proto/gen/user/v1;userv1";

// UserInternal is called only by other services (not exposed via Kong).
// Follower / following counts live in Redis (user:counts:{id}) and are read
// directly there — no gRPC for those.
service UserInternal {
  rpc GetFollowerIDs(GetFollowerIDsRequest) returns (GetFollowerIDsResponse);
  rpc GetFollowingIDs(GetFollowingIDsRequest) returns (GetFollowingIDsResponse);
  rpc GetFollowState(GetFollowStateRequest) returns (GetFollowStateResponse);
  rpc GetUserByID(GetUserByIDRequest) returns (GetUserByIDResponse);
}

message GetFollowerIDsRequest {
  string user_id = 1;
}

message GetFollowerIDsResponse {
  repeated string follower_ids = 1;
}

message GetFollowingIDsRequest {
  string user_id = 1;
}

message GetFollowingIDsResponse {
  repeated string following_ids = 1;
}

message GetFollowStateRequest {
  string viewer_id = 1;
  repeated string target_ids = 2;
}

message GetFollowStateResponse {
  // Map of target_id → true when viewer_id follows target_id. Targets not
  // followed are omitted (callers default missing keys to false).
  map<string, bool> is_following = 1;
}

message GetUserByIDRequest {
  string user_id = 1;
}

message GetUserByIDResponse {
  string user_id      = 1;
  string username     = 2;
  string display_name = 3;
  string avatar_url   = 4;
}
