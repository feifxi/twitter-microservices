version: "2"
sql:
  - engine: "postgresql"
    queries: "db/query.sql"
    schema: "migrations"
    gen:
      go:
        package:                      "db"
        out:                          "db/sqlc"
        sql_package:                  "pgx/v5"
        emit_json_tags:               true
        emit_empty_slices:            true
        emit_pointers_for_null_types: true
        emit_interface:               true
        overrides:
          - db_type: "timestamptz"
            go_type:
              type:   "Time"
              import: "time"
          - db_type: "jsonb"
            go_type:
              type:   "RawMessage"
              import: "encoding/json"
